<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airport Departure Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 10px;
    }
    .widget-container {
      width: 340px; background: #1e293b; border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); border: 1px solid #334155; padding: 12px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; }
    .lang-select { background: #334155; color: #f8fafc; border: 1px solid #475569; border-radius: 4px; padding: 2px 4px; font-size: 10px; outline: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #334155; }
    .airport-title { font-size: 15px; font-weight: bold; color: #38bdf8; }
    .nav-btn { background: #334155; border: none; color: #f8fafc; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 14px; }
    .nav-btn:hover { background: #475569; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    th { text-align: left; color: #94a3b8; font-weight: 500; padding-bottom: 6px; }
    td { padding: 7px 0; border-top: 1px dashed #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .col-time { width: 55px; }
    .col-flight { width: 75px; font-weight: bold; color: #38bdf8; }
    .col-dest { width: auto; color: #f1f5f9; }
    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 10px; color: #64748b; }
    .btn-pip { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-bottom: 15px; }
    .refresh-btn { background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

  <button id="openPipBtn" class="btn-pip">📌 開啟桌面置頂懸浮窗</button>

  <div id="widget" class="widget-container">
    <div class="top-bar">
      <span style="color: #64748b;">✈ JP / TW Live Departures</span>
      <select id="langSelect" class="lang-select">
        <option value="ja">日本語</option>
        <option value="zh">繁體中文</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="header">
      <button class="nav-btn" id="prevBtn">◄</button>
      <div class="airport-title" id="airportName">--</div>
      <button class="nav-btn" id="nextBtn">►</button>
    </div>

    <table>
      <thead>
        <tr id="tableHeader">
          <th class="col-time">定刻</th>
          <th class="col-flight">便名</th>
          <th class="col-dest">行先</th>
        </tr>
      </thead>
      <tbody id="flightTableBody">
        <tr><td colspan="3" style="text-align:center; color:#94a3b8;">Loading...</td></tr>
      </tbody>
    </table>

    <div class="footer">
      <div>
        <span id="updateTime">更新: --:--</span>
        <button class="refresh-btn" id="manualRefreshBtn">🔄</button>
      </div>
      <span style="color: #475569;">台日機場專用</span>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 台日主要機場對照字典 (原生支援 日/中/英 顯示)
    // -------------------------------------------------------------
    const AIRPORT_DICT = {
      HND: { ja: '東京羽田 (HND)', zh: '東京羽田 (HND)', en: 'Tokyo Haneda (HND)' },
      NRT: { ja: '東京成田 (NRT)', zh: '東京成田 (NRT)', en: 'Tokyo Narita (NRT)' },
      KIX: { ja: '大阪關西 (KIX)', zh: '大阪關西 (KIX)', en: 'Osaka Kansai (KIX)' },
      TPE: { ja: '台北桃園 (TPE)', zh: '台北桃園 (TPE)', en: 'Taipei Taoyuan (TPE)' },
      TSA: { ja: '台北松山 (TSA)', zh: '台北松山 (TSA)', en: '台北松山 (TSA)' },
      KHH: { ja: '高雄小港 (KHH)', zh: '高雄小港 (KHH)', en: 'Kaohsiung (KHH)' },
      FUK: { ja: '福岡 (FUK)',     zh: '福岡 (FUK)',     en: 'Fukuoka (FUK)' },
      CTS: { ja: '札幌新千歲 (CTS)',zh: '札幌新千歲 (CTS)',en: 'Sapporo (CTS)' }
    };

    const i18n = {
      ja: { pipBtn: '📌 最前面に表示 (PiP)', headers: ['定刻', '便名', '行先'], update: '更新' },
      zh: { pipBtn: '📌 開啟桌面置頂懸浮窗', headers: ['時間', '航班', '目的地'], update: '更新' },
      en: { pipBtn: '📌 Pin to Desktop', headers: ['Time', 'Flight', 'Destination'], update: 'Updated' }
    };

    // 選單機場清單（可自由調整順序）
    const selectedAirports = [
      { code: 'HND', icao: 'RJTT', timeZone: 'Asia/Tokyo' },
      { code: 'TPE', icao: 'RCTP', timeZone: 'Asia/Taipei' },
      { code: 'KIX', icao: 'RJBB', timeZone: 'Asia/Tokyo' },
      { code: 'TSA', icao: 'RCSS', timeZone: 'Asia/Taipei' }
    ];

    let currentIndex = 0;
    let currentLang = 'ja';

    // 取得該機場當前當地時間 HH:mm
    function getAirportLocalTime(timeZone) {
      const now = new Date();
      const formatter = new Intl.DateTimeFormat('en-GB', {
        timeZone, hour: '2-digit', minute: '2-digit', hour12: false
      });
      return formatter.format(now);
    }

    // 模擬或介接開放 API 資料（包含時間格式化與共掛過濾）
    async function fetchFlightData() {
      const ap = selectedAirports[currentIndex];
      const localNowStr = getAirportLocalTime(ap.timeZone);

      // 提示：若您有新的 API Endpoint，直接在這裡替換 fetch 即可
      // 此處已為您套用「共掛班號去除 + 時區時間過濾 + 多語系地名轉譯」邏輯
      try {
        // 範例測試資料集 (模擬 API 回傳)
        const mockRawData = [
          { time: addMinutes(localNowStr, 15), flight: 'JL099', destCode: 'TSA', isCodeshare: false },
          { time: addMinutes(localNowStr, 15), flight: 'CI9217', destCode: 'TSA', isCodeshare: true }, // 共掛班號
          { time: addMinutes(localNowStr, 35), flight: 'NH853', destCode: 'TSA', isCodeshare: false },
          { time: addMinutes(localNowStr, 50), flight: 'BR191', destCode: 'TPE', isCodeshare: false },
          { time: addMinutes(localNowStr, 80), flight: 'JX801', destCode: 'NRT', isCodeshare: false },
          { time: addMinutes(localNowStr, 105), flight: 'MM023', destCode: 'KIX', isCodeshare: false }
        ];

        // 1. 過濾共掛班號 (isCodeshare === true)
        const cleanList = mockRawData.filter(item => !item.isCodeshare);

        // 2. 轉換目的地名稱為當前語系
        const formattedList = cleanList.map(item => {
          const destObj = AIRPORT_DICT[item.destCode];
          const destName = destObj ? destObj[currentLang] || destObj.en : item.destCode;
          return {
            time: item.time,
            code: item.flight,
            dest: destName
          };
        });

        renderFlights(formattedList);
        updateTimestamp();
      } catch (e) {
        renderFlights([], '讀取失敗');
      }
    }

    function addMinutes(timeStr, mins) {
      const [h, m] = timeStr.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m + mins);
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function renderWidget() {
      const ap = selectedAirports[currentIndex];
      const nameObj = AIRPORT_DICT[ap.code];
      const displayName = nameObj ? nameObj[currentLang] || nameObj.en : ap.code;
      
      document.getElementById('airportName').innerText = `✈ ${displayName}`;
      fetchFlightData();
    }

    function renderFlights(flights, msg = 'No Departures') {
      const tbody = document.getElementById('flightTableBody');
      if (!flights || flights.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8;">${msg}</td></tr>`;
        return;
      }
      tbody.innerHTML = flights.slice(0, 5).map(f => `
        <tr>
          <td class="col-time">${f.time}</td>
          <td class="col-flight">${f.code}</td>
          <td class="col-dest" title="${f.dest}">${f.dest}</td>
        </tr>
      `).join('');
    }

    function updateTimestamp() {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const t = i18n[currentLang] || i18n.ja;
      document.getElementById('updateTime').innerText = `${t.update}: ${timeStr}`;
    }

    function updateLanguageUI() {
      const t = i18n[currentLang] || i18n.ja;
      document.getElementById('openPipBtn').innerText = t.pipBtn;
      const ths = document.querySelectorAll('#tableHeader th');
      t.headers.forEach((h, idx) => { if(ths[idx]) ths[idx].innerText = h; });
      renderWidget();
    }

    function attachEventListeners(targetDoc) {
      targetDoc.addEventListener('click', (e) => {
        if (e.target.id === 'nextBtn') {
          currentIndex = (currentIndex + 1) % selectedAirports.length;
          renderWidget();
        } else if (e.target.id === 'prevBtn') {
          currentIndex = (currentIndex - 1 + selectedAirports.length) % selectedAirports.length;
          renderWidget();
        } else if (e.target.id === 'manualRefreshBtn') {
          fetchFlightData();
        }
      });

      targetDoc.addEventListener('change', (e) => {
        if (e.target.id === 'langSelect') {
          currentLang = e.target.value;
          updateLanguageUI();
        }
      });
    }

    attachEventListeners(document);

    // PiP 懸浮視窗功能
    document.getElementById('openPipBtn').addEventListener('click', async () => {
      if ('documentPictureInPicture' in window) {
        const pipWindow = await window.documentPictureInPicture.requestWindow({ width: 350, height: 220 });
        [...document.styleSheets].forEach((styleSheet) => {
          try {
            const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
            const style = document.createElement('style');
            style.textContent = cssRules;
            pipWindow.document.head.appendChild(style);
          } catch (e) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = styleSheet.href;
            pipWindow.document.head.appendChild(link);
          }
        });

        const widget = document.getElementById('widget');
        pipWindow.document.body.appendChild(widget);
        attachEventListeners(pipWindow.document);

        pipWindow.addEventListener('unload', () => {
          document.body.appendChild(widget);
        });
      } else {
        alert('請使用 Chrome 或 Edge 瀏覽器開啟。');
      }
    });

    updateLanguageUI();
  </script>
</body>
</html>
