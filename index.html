<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airport Flight Status Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 10px;
    }
    
    .widget-container {
      width: 330px; background: #1e293b; border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); overflow: hidden;
      border: 1px solid #334155; padding: 12px; position: relative;
    }
    
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; font-size: 11px;
    }
    
    .lang-select {
      background: #334155; color: #f8fafc; border: 1px solid #475569;
      border-radius: 4px; padding: 2px 4px; font-size: 11px; outline: none; cursor: pointer;
    }
    
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #334155;
    }
    .airport-title { font-size: 15px; font-weight: bold; color: #38bdf8; }
    .nav-btn {
      background: #334155; border: none; color: #f8fafc; cursor: pointer;
      padding: 4px 10px; border-radius: 4px; font-size: 14px; transition: 0.2s;
    }
    .nav-btn:hover { background: #475569; }
    .nav-btn:active { background: #0284c7; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; color: #94a3b8; font-weight: 500; padding-bottom: 6px; }
    td { padding: 6px 0; border-top: 1px dashed #334155; }
    
    .flight-no { font-weight: bold; color: #f1f5f9; }
    .status-ok { color: #4ade80; }
    .status-delay { color: #f87171; }
    
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; font-size: 10px; color: #64748b;
    }
    .btn-pip {
      background: #0284c7; color: white; border: none; padding: 8px 16px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .btn-pip:hover { background: #0369a1; }
    .refresh-btn { background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 12px; margin-left: 4px; }
  </style>
</head>
<body>

  <button id="openPipBtn" class="btn-pip" style="margin-bottom: 15px;">📌 開啟桌面置頂懸浮窗</button>

  <div id="widget" class="widget-container">
    <div class="top-bar">
      <span style="color: #64748b;">✈ Flight Status</span>
      <select id="langSelect" class="lang-select">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="zh">繁體中文</option>
      </select>
    </div>

    <div class="header">
      <button class="nav-btn" id="prevBtn">◄</button>
      <div class="airport-title" id="airportName">✈ ヘルシンキ (HEL)</div>
      <button class="nav-btn" id="nextBtn">►</button>
    </div>

    <table>
      <thead>
        <tr id="tableHeader">
          <th>定刻</th>
          <th>便名</th>
          <th>行先</th>
          <th>状態</th>
        </tr>
      </thead>
      <tbody id="flightTableBody">
        <tr><td colspan="4" style="text-align:center; color:#94a3b8;">Loading...</td></tr>
      </tbody>
    </table>

    <div class="footer">
      <div>
        <span id="updateTime">更新: --:--</span>
        <button class="refresh-btn" id="manualRefreshBtn" title="Force Refresh">🔄</button>
      </div>
      <span style="color: #475569;">1h Cache</span>
    </div>
  </div>

  <script>
    // 多語言字典設定
    const i18n = {
      ja: {
        pipBtn: '📌 最前面に表示 (PiP)',
        headers: ['定刻', '便名', '行先', '状態'],
        statusOk: '定刻',
        statusDelay: '遅延',
        statusBoarding: '搭乗中',
        update: '更新',
        airports: {
          HEL: 'ヘルシンキ (HEL)',
          HND: '東京羽田 (HND)',
          TPE: '台北桃園 (TPE)'
        }
      },
      en: {
        pipBtn: '📌 Pin to Desktop',
        headers: ['Time', 'Flight', 'Dest', 'Status'],
        statusOk: 'On Time',
        statusDelay: 'Delayed',
        statusBoarding: 'Boarding',
        update: 'Updated',
        airports: {
          HEL: 'Helsinki (HEL)',
          HND: 'Tokyo Haneda (HND)',
          TPE: 'Taipei Taoyuan (TPE)'
        }
      },
      zh: {
        pipBtn: '📌 開啟桌面置頂懸浮窗',
        headers: ['預定', '航班', '目的地', '狀態'],
        statusOk: '準時',
        statusDelay: '延誤',
        statusBoarding: '登機中',
        update: '更新',
        airports: {
          HEL: '赫爾辛基 (HEL)',
          HND: '東京羽田 (HND)',
          TPE: '台北桃園 (TPE)'
        }
      }
    };

    const airports = [
      { code: 'HEL', icao: 'EFHK' },
      { code: 'HND', icao: 'RJTT' },
      { code: 'TPE', icao: 'RCTP' }
    ];

    // 填入您的 RapidAPI Key (如果沒填，會自動顯示擬真展示資料，絕不報錯)
    const API_KEY = 'c8a03a5aeemshca1183c29c06ad5p19c8adjsn5eed4dd704a9';

    let currentIndex = 0;
    let currentLang = 'ja'; // 預設全日文介面
    const CACHE_DURATION = 60 * 60 * 1000; // 1 小時快取 (毫秒)

    function getLang() {
      return i18n[currentLang] || i18n['ja'];
    }

    function updateLanguageUI() {
      const lang = getLang();
      document.getElementById('openPipBtn').innerText = lang.pipBtn;
      
      const ths = document.querySelectorAll('#tableHeader th');
      lang.headers.forEach((h, idx) => { if(ths[idx]) ths[idx].innerText = h; });

      renderWidget();
    }

    async function fetchFlightData(forceRefresh = false) {
      const ap = airports[currentIndex];
      const cacheKey = `flight_cache_${ap.code}`;
      const cached = localStorage.getItem(cacheKey);
      const now = Date.now();

      // 一小時內使用快取資料
      if (!forceRefresh && cached) {
        const { timestamp, flights } = JSON.parse(cached);
        if (now - timestamp < CACHE_DURATION) {
          renderFlights(flights);
          updateTimestamp(new Date(timestamp));
          return;
        }
      }

      // 對外請求最新資料
      if (API_KEY && API_KEY !== 'YOUR_AERODATABOX_API_KEY') {
        try {
          const response = await fetch(`https://aerodatabox.p.rapidapi.com/flights/airports/icao/${ap.icao}?departures=true&limit=5`, {
            headers: {
              'x-rapidapi-key': API_KEY,
              'x-rapidapi-host': 'aerodatabox.p.rapidapi.com'
            }
          });
          const data = await response.json();
          const parsed = parseApiData(data.departures);
          
          // 寫入快取
          localStorage.setItem(cacheKey, JSON.stringify({ timestamp: now, flights: parsed }));
          renderFlights(parsed);
          updateTimestamp(new Date(now));
          return;
        } catch (e) {
          console.error("API error, fallback to demo data", e);
        }
      }

      // 未設定 Key 或呼叫失敗時的模擬資料
      const mockData = getMockData(ap.code);
      renderFlights(mockData);
      updateTimestamp(new Date());
    }

    function parseApiData(departures) {
      if (!departures) return [];
      const lang = getLang();
      return departures.slice(0, 5).map(f => {
        const time = (f.movement.scheduledTimeLocal || '').substring(11, 16);
        const code = f.number || '--';
        const dest = (f.movement.airport && (f.movement.airport.iata || f.movement.airport.name)) || '--';
        const rawStatus = f.status || '';
        let status = lang.statusOk;
        let isOk = true;

        if (rawStatus.includes('Delayed') || rawStatus.includes('Canceled')) {
          status = lang.statusDelay;
          isOk = false;
        } else if (rawStatus.includes('Boarding')) {
          status = lang.statusBoarding;
        }

        return { time, code, dest, status, ok: isOk };
      });
    }

    function getMockData(code) {
      const lang = getLang();
      const mock = {
        HEL: [
          { time: '14:05', code: 'AY133', dest: 'HND', status: lang.statusOk, ok: true },
          { time: '14:20', code: 'AY141', dest: 'BKK', status: lang.statusOk, ok: true },
          { time: '14:35', code: 'AY121', dest: 'DEL', status: lang.statusOk, ok: true },
          { time: '14:50', code: 'KL117', dest: 'AMS', status: lang.statusDelay, ok: false },
          { time: '15:10', code: 'LH246', dest: 'FRA', status: lang.statusBoarding, ok: true }
        ],
        HND: [
          { time: '14:15', code: 'JL097', dest: 'TSA', status: lang.statusOk, ok: true },
          { time: '14:30', code: 'NH853', dest: 'TSA', status: lang.statusOk, ok: true },
          { time: '14:45', code: 'CI101', dest: 'TPE', status: lang.statusBoarding, ok: true },
          { time: '15:00', code: 'JL031', dest: 'BKK', status: lang.statusOk, ok: true },
          { time: '15:20', code: 'CX549', dest: 'HKG', status: lang.statusDelay, ok: false }
        ],
        TPE: [
          { time: '14:10', code: 'BR198', dest: 'NRT', status: lang.statusOk, ok: true },
          { time: '14:25', code: 'CI108', dest: 'NRT', status: lang.statusBoarding, ok: true },
          { time: '14:40', code: 'JX802', dest: 'NRT', status: lang.statusOk, ok: true },
          { time: '15:05', code: 'BR215', dest: 'SIN', status: lang.statusOk, ok: true },
          { time: '15:30', code: 'CI751', dest: 'SIN', status: lang.statusOk, ok: true }
        ]
      };
      return mock[code] || [];
    }

    function renderWidget() {
      const ap = airports[currentIndex];
      const lang = getLang();
      document.getElementById('airportName').innerText = `✈ ${lang.airports[ap.code]}`;
      fetchFlightData(false);
    }

    function renderFlights(flights) {
      const tbody = document.getElementById('flightTableBody');
      if (flights.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No Data</td></tr>';
        return;
      }
      tbody.innerHTML = flights.map(f => `
        <tr>
          <td>${f.time}</td>
          <td class="flight-no">${f.code}</td>
          <td>${f.dest}</td>
          <td class="${f.ok ? 'status-ok' : 'status-delay'}">${f.status}</td>
        </tr>
      `).join('');
    }

    function updateTimestamp(dateObj) {
      const lang = getLang();
      const timeStr = dateObj.toTimeString().substring(0, 5);
      document.getElementById('updateTime').innerText = `${lang.update}: ${timeStr}`;
    }

    // 事件綁定 (確保點擊有效)
    document.addEventListener('click', (e) => {
      if (e.target.id === 'nextBtn') {
        currentIndex = (currentIndex + 1) % airports.length;
        renderWidget();
      } else if (e.target.id === 'prevBtn') {
        currentIndex = (currentIndex - 1 + airports.length) % airports.length;
        renderWidget();
      } else if (e.target.id === 'manualRefreshBtn') {
        fetchFlightData(true); // 強制手動刷新，無視快取
      }
    });

    // 語言切換事件
    document.addEventListener('change', (e) => {
      if (e.target.id === 'langSelect') {
        currentLang = e.target.value;
        updateLanguageUI();
      }
    });

    // Document Picture-in-Picture 置頂視窗處理
    document.getElementById('openPipBtn').addEventListener('click', async () => {
      if ('documentPictureInPicture' in window) {
        const pipWindow = await window.documentPictureInPicture.requestWindow({
          width: 350,
          height: 220,
        });

        [...document.styleSheets].forEach((styleSheet) => {
          try {
            const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
            const style = document.createElement('style');
            style.textContent = cssRules;
            pipWindow.document.head.appendChild(style);
          } catch (e) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = styleSheet.href;
            pipWindow.document.head.appendChild(link);
          }
        });

        const widget = document.getElementById('widget');
        pipWindow.document.body.appendChild(widget);

        pipWindow.addEventListener('unload', () => {
          document.body.appendChild(widget);
        });
      } else {
        alert('Chrome / Edge の最新版をご利用ください。 (Please use Chrome or Edge for PiP)');
      }
    });

    // 初始化介面
    updateLanguageUI();
  </script>
</body>
</html>
