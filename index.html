<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airport Departure Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 10px;
    }
    
    .widget-container {
      width: 340px; background: #1e293b; border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); overflow: hidden;
      border: 1px solid #334155; padding: 12px; position: relative;
    }
    
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; font-size: 11px;
    }
    
    .sub-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; font-size: 10px; color: #94a3b8;
    }

    .lang-select, .tz-select {
      background: #334155; color: #f8fafc; border: 1px solid #475569;
      border-radius: 4px; padding: 2px 4px; font-size: 10px; outline: none; cursor: pointer;
    }
    
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #334155;
    }
    .airport-title { font-size: 15px; font-weight: bold; color: #38bdf8; }
    .nav-btn {
      background: #334155; border: none; color: #f8fafc; cursor: pointer;
      padding: 4px 10px; border-radius: 4px; font-size: 14px; transition: 0.2s;
    }
    .nav-btn:hover { background: #475569; }
    .nav-btn:active { background: #0284c7; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    th { text-align: left; color: #94a3b8; font-weight: 500; padding-bottom: 6px; }
    td { padding: 7px 0; border-top: 1px dashed #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .col-time { width: 55px; }
    .col-flight { width: 75px; font-weight: bold; color: #38bdf8; }
    .col-dest { width: auto; color: #f1f5f9; }

    .footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; font-size: 10px; color: #64748b;
    }
    .btn-pip {
      background: #0284c7; color: white; border: none; padding: 8px 16px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .btn-pip:hover { background: #0369a1; }
    .refresh-btn { background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 12px; margin-left: 4px; }
  </style>
</head>
<body>

  <button id="openPipBtn" class="btn-pip" style="margin-bottom: 15px;">📌 開啟桌面置頂懸浮窗</button>

  <div id="widget" class="widget-container">
    <div class="top-bar">
      <span style="color: #64748b;">🛫 Domestic & Int'l</span>
      <select id="langSelect" class="lang-select">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="zh">繁體中文</option>
      </select>
    </div>

    <div class="sub-bar">
      <span>Time Mode:</span>
      <select id="tzSelect" class="tz-select">
        <option value="local">現地時間 (Local)</option>
        <option value="tpe">台灣時間 (TPE / UTC+8)</option>
      </select>
    </div>

    <div class="header">
      <button class="nav-btn" id="prevBtn">◄</button>
      <div class="airport-title" id="airportName">✈ ヘルシンキ (HEL)</div>
      <button class="nav-btn" id="nextBtn">►</button>
    </div>

    <table>
      <thead>
        <tr id="tableHeader">
          <th class="col-time">定刻</th>
          <th class="col-flight">便名</th>
          <th class="col-dest">行先</th>
        </tr>
      </thead>
      <tbody id="flightTableBody">
        <tr><td colspan="3" style="text-align:center; color:#94a3b8;">Loading...</td></tr>
      </tbody>
    </table>

    <div class="footer">
      <div>
        <span id="updateTime">更新: --:--</span>
        <button class="refresh-btn" id="manualRefreshBtn" title="Force Refresh">🔄</button>
      </div>
      <span style="color: #475569;">1h Cache</span>
    </div>
  </div>

  <script>
    const i18n = {
      ja: {
        pipBtn: '📌 最前面に表示 (PiP)',
        headers: ['定刻', '便名', '行先'],
        update: '更新',
        airports: {
          HEL: 'ヘルシンキ (HEL)',
          HND: '東京羽田 (HND)',
          TPE: '台北桃園 (TPE)'
        }
      },
      en: {
        pipBtn: '📌 Pin to Desktop',
        headers: ['Time', 'Flight', 'Destination'],
        update: 'Updated',
        airports: {
          HEL: 'Helsinki (HEL)',
          HND: 'Tokyo Haneda (HND)',
          TPE: 'Taipei Taoyuan (TPE)'
        }
      },
      zh: {
        pipBtn: '📌 開啟桌面置頂懸浮窗',
        headers: ['時間', '航班', '目的地'],
        update: '更新',
        airports: {
          HEL: '赫爾辛基 (HEL)',
          HND: '東京羽田 (HND)',
          TPE: '台北桃園 (TPE)'
        }
      }
    };

    const airports = [
      { code: 'HEL', icao: 'EFHK', tzOffset: 3 }, // EEST (UTC+3)
      { code: 'HND', icao: 'RJTT', tzOffset: 9 }, // JST (UTC+9)
      { code: 'TPE', icao: 'RCTP', tzOffset: 8 }  // CST (UTC+8)
    ];

    const API_KEY = 'YOUR_AERODATABOX_API_KEY';
    let currentIndex = 0;
    let currentLang = 'ja';
    let timeMode = 'local'; // 'local' or 'tpe'
    const CACHE_DURATION = 60 * 60 * 1000;

    function getLang() { return i18n[currentLang] || i18n['ja']; }

    function updateLanguageUI() {
      const lang = getLang();
      document.getElementById('openPipBtn').innerText = lang.pipBtn;
      const ths = document.querySelectorAll('#tableHeader th');
      lang.headers.forEach((h, idx) => { if(ths[idx]) ths[idx].innerText = h; });
      renderWidget();
    }

    async function fetchFlightData(forceRefresh = false) {
      const ap = airports[currentIndex];
      const cacheKey = `flight_cache_mix_${ap.code}`;
      const cached = localStorage.getItem(cacheKey);
      const now = Date.now();

      if (!forceRefresh && cached) {
        const { timestamp, flights } = JSON.parse(cached);
        if (now - timestamp < CACHE_DURATION) {
          renderFlights(flights);
          updateTimestamp(new Date(timestamp));
          return;
        }
      }

      if (API_KEY && API_KEY !== 'YOUR_AERODATABOX_API_KEY') {
        try {
          const response = await fetch(`https://aerodatabox.p.rapidapi.com/flights/airports/icao/${ap.icao}?departures=true&limit=20`, {
            headers: {
              'x-rapidapi-key': API_KEY,
              'x-rapidapi-host': 'aerodatabox.p.rapidapi.com'
            }
          });
          const data = await response.json();
          const parsed = parseApiData(data.departures, ap);
          
          localStorage.setItem(cacheKey, JSON.stringify({ timestamp: now, flights: parsed }));
          renderFlights(parsed);
          updateTimestamp(new Date(now));
          return;
        } catch (e) {
          console.error("API error, fallback to mock data", e);
        }
      }

      const mockData = getMockData(ap.code);
      renderFlights(mockData);
      updateTimestamp(new Date());
    }

    function parseApiData(departures, ap) {
      if (!departures) return [];
      
      const uniqueFlights = [];
      const seenKeys = new Set();

      for (const f of departures) {
        const rawLocalTime = f.movement.scheduledTimeLocal || '';
        const localTimeStr = rawLocalTime.substring(11, 16);
        
        // 時間換算 (將當地時間換算為 TPE 台灣時間)
        let displayTime = localTimeStr;
        if (timeMode === 'tpe' && rawLocalTime) {
          const dateObj = new Date(f.movement.scheduledTimeUtc || rawLocalTime);
          // 轉為 TPE (UTC+8) 時間
          const tpeHour = (dateObj.getUTCHours() + 8) % 24;
          const tpeMin = String(dateObj.getUTCMinutes()).padStart(2, '0');
          displayTime = `${String(tpeHour).padStart(2, '0')}:${tpeMin}`;
        }

        const code = f.number || '--';
        
        let destName = '';
        if (f.movement.airport) {
          const iata = f.movement.airport.iata || '';
          const name = f.movement.airport.name || f.movement.airport.municipalityName || '';
          destName = iata ? `${iata} ${name}` : name;
        } else {
          destName = '--';
        }

        const dedupKey = `${localTimeStr}_${destName.trim().toUpperCase()}`;

        if (!seenKeys.has(dedupKey)) {
          seenKeys.add(dedupKey);
          uniqueFlights.push({ time: displayTime, code, dest: destName });
        }

        if (uniqueFlights.length >= 5) break;
      }

      return uniqueFlights;
    }

    function getMockData(code) {
      // 模擬資料包含國內線 (Domestic) 與國際線 (International) 混合
      const mock = {
        HEL: [
          { time: '14:05', code: 'AY133', dest: 'HND 羽田 (Int\'l)' },
          { time: '14:15', code: 'AY533', dest: 'RVN ロヴァニエミ (Dom)' }, // 芬蘭國內線
          { time: '14:20', code: 'AY141', dest: 'BKK バンコク (Int\'l)' },
          { time: '14:40', code: 'AY437', dest: 'OUL オウル (Dom)' },      // 芬蘭國內線
          { time: '14:50', code: 'KL117', dest: 'AMS アムステルダム (Int\'l)' }
        ],
        HND: [
          { time: '14:00', code: 'NH067', dest: 'CTS 新千歳 (Dom)' },     // 日本國內線
          { time: '14:15', code: 'JL097', dest: 'TSA 松山 / 台北 (Int\'l)' },
          { time: '14:25', code: 'JL319', dest: 'FUK 福岡 (Dom)' },       // 日本國內線
          { time: '14:30', code: 'NH853', dest: 'TSA 松山 / 台北 (Int\'l)' },
          { time: '14:40', code: 'JL121', dest: 'ITM 伊丹 / 大阪 (Dom)' } // 日本國內線
        ],
        TPE: [
          { time: '14:10', code: 'BR198', dest: 'NRT 成田' },
          { time: '14:25', code: 'CI108', dest: 'NRT 成田' },
          { time: '14:40', code: 'JX802', dest: 'NRT 成田' },
          { time: '15:05', code: 'BR215', dest: 'SIN シンガポール' },
          { time: '15:30', code: 'CI751', dest: 'SIN シンガポール' }
        ]
      };
      return mock[code] || [];
    }

    function renderWidget() {
      const ap = airports[currentIndex];
      const lang = getLang();
      document.getElementById('airportName').innerText = `✈ ${lang.airports[ap.code]}`;
      fetchFlightData(false);
    }

    function renderFlights(flights) {
      const tbody = document.getElementById('flightTableBody');
      if (flights.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No Departures</td></tr>';
        return;
      }
      tbody.innerHTML = flights.map(f => `
        <tr>
          <td class="col-time">${f.time}</td>
          <td class="col-flight">${f.code}</td>
          <td class="col-dest" title="${f.dest}">${f.dest}</td>
        </tr>
      `).join('');
    }

    function updateTimestamp(dateObj) {
      const lang = getLang();
      const timeStr = dateObj.toTimeString().substring(0, 5);
      document.getElementById('updateTime').innerText = `${lang.update}: ${timeStr}`;
    }

    // 事件監聽
    document.addEventListener('click', (e) => {
      if (e.target.id === 'nextBtn') {
        currentIndex = (currentIndex + 1) % airports.length;
        renderWidget();
      } else if (e.target.id === 'prevBtn') {
        currentIndex = (currentIndex - 1 + airports.length) % airports.length;
        renderWidget();
      } else if (e.target.id === 'manualRefreshBtn') {
        fetchFlightData(true);
      }
    });

    document.addEventListener('change', (e) => {
      if (e.target.id === 'langSelect') {
        currentLang = e.target.value;
        updateLanguageUI();
      } else if (e.target.id === 'tzSelect') {
        timeMode = e.target.value;
        fetchFlightData(false);
      }
    });

    // PiP 置頂懸浮窗
    document.getElementById('openPipBtn').addEventListener('click', async () => {
      if ('documentPictureInPicture' in window) {
        const pipWindow = await window.documentPictureInPicture.requestWindow({
          width: 350,
          height: 235,
        });

        [...document.styleSheets].forEach((styleSheet) => {
          try {
            const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
            const style = document.createElement('style');
            style.textContent = cssRules;
            pipWindow.document.head.appendChild(style);
          } catch (e) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = styleSheet.href;
            pipWindow.document.head.appendChild(link);
          }
        });

        const widget = document.getElementById('widget');
        pipWindow.document.body.appendChild(widget);

        pipWindow.addEventListener('unload', () => {
          document.body.appendChild(widget);
        });
      } else {
        alert('Chrome / Edge の最新版をご利用ください。');
      }
    });

    updateLanguageUI();
  </script>
</body>
</html>
