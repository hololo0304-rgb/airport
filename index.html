<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airport Departure Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 10px;
    }
    
    .widget-container {
      width: 340px; background: #1e293b; border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); overflow: hidden;
      border: 1px solid #334155; padding: 12px; position: relative;
    }
    
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; font-size: 11px;
    }

    .lang-select {
      background: #334155; color: #f8fafc; border: 1px solid #475569;
      border-radius: 4px; padding: 2px 4px; font-size: 10px; outline: none; cursor: pointer;
    }
    
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #334155;
    }
    .airport-title { font-size: 15px; font-weight: bold; color: #38bdf8; }
    .nav-btn {
      background: #334155; border: none; color: #f8fafc; cursor: pointer;
      padding: 4px 10px; border-radius: 4px; font-size: 14px; transition: 0.2s;
    }
    .nav-btn:hover { background: #475569; }
    .nav-btn:active { background: #0284c7; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    th { text-align: left; color: #94a3b8; font-weight: 500; padding-bottom: 6px; }
    td { padding: 7px 0; border-top: 1px dashed #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .col-time { width: 55px; }
    .col-flight { width: 75px; font-weight: bold; color: #38bdf8; }
    .col-dest { width: auto; color: #f1f5f9; }

    .footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; font-size: 10px; color: #64748b;
    }
    .btn-pip {
      background: #0284c7; color: white; border: none; padding: 8px 16px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .btn-pip:hover { background: #0369a1; }
    .refresh-btn { background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 12px; margin-left: 4px; }
  </style>
</head>
<body>

  <button id="openPipBtn" class="btn-pip" style="margin-bottom: 15px;">📌 開啟桌面置頂懸浮窗</button>

  <div id="widget" class="widget-container">
    <div class="top-bar">
      <span style="color: #64748b;">✈ Live Departures</span>
      <select id="langSelect" class="lang-select">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="zh">繁體中文</option>
      </select>
    </div>

    <div class="header">
      <button class="nav-btn" id="prevBtn">◄</button>
      <div class="airport-title" id="airportName">✈ ヘルシンキ (HEL)</div>
      <button class="nav-btn" id="nextBtn">►</button>
    </div>

    <table>
      <thead>
        <tr id="tableHeader">
          <th class="col-time">定刻</th>
          <th class="col-flight">便名</th>
          <th class="col-dest">行先</th>
        </tr>
      </thead>
      <tbody id="flightTableBody">
        <tr><td colspan="3" style="text-align:center; color:#94a3b8;">Loading...</td></tr>
      </tbody>
    </table>

    <div class="footer">
      <div>
        <span id="updateTime">更新: --:--</span>
        <button class="refresh-btn" id="manualRefreshBtn" title="Force Refresh">🔄</button>
      </div>
      <span style="color: #475569;">12h Batch</span>
    </div>
  </div>

  <script>
    const API_KEY = 'c8a03a5aeemshca1183c29c06ad5p19c8adjsn5eed4dd704a9';

    // 機場/目的地多國語言字典（API 僅回傳英文地名，故需要對照）
    const cityTranslations = {
      ja: {
        'Helsinki': 'ヘルシンキ',
        'Tokyo': '東京',
        'Haneda': '羽田',
        'Narita': '成田',
        'Taipei': '台北',
        'Taoyuan': '桃園',
        'London': 'ロンドン',
        'Paris': 'パリ',
        'Frankfurt': 'フランクフルト',
        'Bangkok': 'バンコク',
        'Singapore': 'シンガポール',
        'Seoul': 'ソウル',
        'Incheon': '仁川'
      },
      zh: {
        'Helsinki': '赫爾辛基',
        'Tokyo': '東京',
        'Haneda': '羽田',
        'Narita': '成田',
        'Taipei': '台北',
        'Taoyuan': '桃園',
        'London': '倫敦',
        'Paris': '巴黎',
        'Frankfurt': '法蘭克福',
        'Bangkok': '曼谷',
        'Singapore': '新加坡',
        'Seoul': '首爾',
        'Incheon': '仁川'
      }
    };

    const i18n = {
      ja: {
        pipBtn: '📌 最前面に表示 (PiP)',
        headers: ['定刻', '便名', '行先'],
        update: '更新',
        airports: {
          HEL: 'ヘルシンキ (HEL)',
          HND: '東京羽田 (HND)',
          TPE: '台北桃園 (TPE)'
        }
      },
      en: {
        pipBtn: '📌 Pin to Desktop',
        headers: ['Time', 'Flight', 'Destination'],
        update: 'Updated',
        airports: {
          HEL: 'Helsinki (HEL)',
          HND: 'Tokyo Haneda (HND)',
          TPE: 'Taipei Taoyuan (TPE)'
        }
      },
      zh: {
        pipBtn: '📌 開啟桌面置頂懸浮窗',
        headers: ['時間', '航班', '目的地'],
        update: '更新',
        airports: {
          HEL: '赫爾辛基 (HEL)',
          HND: '東京羽田 (HND)',
          TPE: '台北桃園 (TPE)'
        }
      }
    };

    const airports = [
      { code: 'HEL', icao: 'EFHK', timeZone: 'Europe/Helsinki' },
      { code: 'HND', icao: 'RJTT', timeZone: 'Asia/Tokyo' },
      { code: 'TPE', icao: 'RCTP', timeZone: 'Asia/Taipei' }
    ];

    let currentIndex = 0;
    let currentLang = 'ja';
    const CACHE_DURATION = 6 * 60 * 60 * 1000;

    function getLang() { return i18n[currentLang] || i18n['ja']; }

    // 格式化指定時區的 Date 物件字串：YYYY-MM-DDTHH:mm
    function getISOStringInTimeZone(date, timeZone) {
      const formatter = new Intl.DateTimeFormat('sv-SE', {
        timeZone,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
      });
      return formatter.format(date).replace(' ', 'T');
    }

    // 取得機場當前當地時間 HH:mm
    function getAirportLocalTimeStr(timeZone) {
      const now = new Date();
      const options = { timeZone, hour12: false, hour: '2-digit', minute: '2-digit' };
      const parts = new Intl.DateTimeFormat('en-US', options).formatToParts(now);
      const v = {};
      parts.forEach(p => v[p.type] = p.value);
      return `${v.hour}:${v.minute}`;
    }

    // 翻譯目的地地名
    function translateLocation(iata, nameRaw) {
      if (currentLang === 'en') {
        return iata ? `${iata} ${nameRaw}` : nameRaw;
      }
      const dict = cityTranslations[currentLang] || {};
      let translated = nameRaw;
      
      Object.keys(dict).forEach(key => {
        const reg = new RegExp(key, 'gi');
        translated = translated.replace(reg, dict[key]);
      });

      return iata ? `${iata} ${translated}` : translated;
    }

    async function fetchFlightData(forceRefresh = false) {
      const ap = airports[currentIndex];
      const cacheKey = `flight_batch_12h_${ap.code}`;
      const cached = localStorage.getItem(cacheKey);
      const now = Date.now();

      if (!forceRefresh && cached) {
        const { timestamp, flights } = JSON.parse(cached);
        if (now - timestamp < CACHE_DURATION) {
          filterAndRender(flights, ap);
          updateTimestamp(new Date(timestamp));
          return;
        }
      }

      if (!API_KEY || API_KEY === 'YOUR_AERODATABOX_API_KEY') {
        renderFlights([], '請先設定 API Key');
        return;
      }

      try {
        const nowObj = new Date();
        // 修正：依據該機場時區計算 API 查詢起迄時間
        const fromISO = getISOStringInTimeZone(nowObj, ap.timeZone).substring(0, 16);
        const toObj = new Date(nowObj.getTime() + 12 * 60 * 60 * 1000);
        const toISO = getISOStringInTimeZone(toObj, ap.timeZone).substring(0, 16);

        const response = await fetch(`https://aerodatabox.p.rapidapi.com/flights/airports/icao/${ap.icao}/${fromISO}/${toISO}?departures=true&codeshares=false`, {
          headers: {
            'x-rapidapi-key': API_KEY,
            'x-rapidapi-host': 'aerodatabox.p.rapidapi.com'
          }
        });

        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

        const data = await response.json();
        const fullList = parseApiBatchData(data.departures);
        
        localStorage.setItem(cacheKey, JSON.stringify({ timestamp: now, flights: fullList }));
        filterAndRender(fullList, ap);
        updateTimestamp(new Date(now));
      } catch (e) {
        console.error("API Fetch Error:", e);
        renderFlights([], 'API 讀取失敗');
      }
    }

    function parseApiBatchData(departures) {
      if (!departures) return [];

      const result = [];
      const primaryFlightsMap = new Map();

      departures.forEach(f => {
        // 1. 過濾共掛班號 (Codeshare)
        if (f.codeshareStatus === 'IsCodeshare') return;

        // 2. 解析時間
        let timeStr = '--:--';
        if (f.movement && f.movement.scheduledTimeLocal) {
          const rawLocal = f.movement.scheduledTimeLocal;
          const match = rawLocal.match(/T(\d{2}:\d{2})/);
          if (match) timeStr = match[1];
        }

        const code = f.number || '--';

        // 3. 取得原始目的地資訊
        let iata = '';
        let rawDestName = '';
        if (f.movement && f.movement.airport) {
          iata = f.movement.airport.iata || '';
          rawDestName = f.movement.airport.municipalityName || f.movement.airport.name || '';
        } else {
          rawDestName = '--';
        }

        // 4. secondary 防呆：若有相同時間與目的地，只留第一班（主要航班）
        const primaryKey = `${timeStr}_${iata || rawDestName}`;
        if (!primaryFlightsMap.has(primaryKey)) {
          const flightObj = { time: timeStr, code, iata, rawDestName };
          primaryFlightsMap.set(primaryKey, flightObj);
          result.push(flightObj);
        }
      });

      return result;
    }

    function filterAndRender(fullList, ap) {
      const curLocalTime = getAirportLocalTimeStr(ap.timeZone);
      
      let upcoming = fullList.filter(f => f.time >= curLocalTime);
      
      if (upcoming.length < 5) {
        upcoming = upcoming.concat(fullList);
      }

      const displayFlights = [];
      const seen = new Set();
      for (const f of upcoming) {
        const key = `${f.time}_${f.code}`;
        if (!seen.has(key)) {
          seen.add(key);
          displayFlights.push(f);
        }
        if (displayFlights.length >= 5) break;
      }

      renderFlights(displayFlights);
    }

    function renderWidget() {
      const ap = airports[currentIndex];
      const lang = getLang();
      document.getElementById('airportName').innerText = `✈ ${lang.airports[ap.code]}`;
      fetchFlightData(false);
    }

    function renderFlights(flights, msg = 'No Departures') {
      const tbody = document.getElementById('flightTableBody');
      if (!flights || flights.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8;">${msg}</td></tr>`;
        return;
      }

      tbody.innerHTML = flights.map(f => {
        // 即時對應語言檔翻譯地名
        const destDisplay = translateLocation(f.iata, f.rawDestName);
        return `
          <tr>
            <td class="col-time">${f.time}</td>
            <td class="col-flight">${f.code}</td>
            <td class="col-dest" title="${destDisplay}">${destDisplay}</td>
          </tr>
        `;
      }).join('');
    }

    function updateTimestamp(dateObj) {
      const lang = getLang();
      const timeStr = dateObj.toTimeString().substring(0, 5);
      document.getElementById('updateTime').innerText = `${lang.update}: ${timeStr}`;
    }

    function updateLanguageUI() {
      const lang = getLang();
      document.getElementById('openPipBtn').innerText = lang.pipBtn;
      const ths = document.querySelectorAll('#tableHeader th');
      lang.headers.forEach((h, idx) => { if(ths[idx]) ths[idx].innerText = h; });
      renderWidget();
    }

    function attachEventListeners(targetDoc) {
      targetDoc.addEventListener('click', (e) => {
        if (e.target.id === 'nextBtn') {
          currentIndex = (currentIndex + 1) % airports.length;
          renderWidget();
        } else if (e.target.id === 'prevBtn') {
          currentIndex = (currentIndex - 1 + airports.length) % airports.length;
          renderWidget();
        } else if (e.target.id === 'manualRefreshBtn') {
          fetchFlightData(true);
        }
      });

      targetDoc.addEventListener('change', (e) => {
        if (e.target.id === 'langSelect') {
          currentLang = e.target.value;
          updateLanguageUI();
        }
      });
    }

    attachEventListeners(document);

    document.getElementById('openPipBtn').addEventListener('click', async () => {
      if ('documentPictureInPicture' in window) {
        const pipWindow = await window.documentPictureInPicture.requestWindow({
          width: 350,
          height: 220,
        });

        [...document.styleSheets].forEach((styleSheet) => {
          try {
            const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
            const style = document.createElement('style');
            style.textContent = cssRules;
            pipWindow.document.head.appendChild(style);
          } catch (e) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = styleSheet.href;
            pipWindow.document.head.appendChild(link);
          }
        });

        const widget = document.getElementById('widget');
        pipWindow.document.body.appendChild(widget);

        attachEventListeners(pipWindow.document);

        pipWindow.addEventListener('unload', () => {
          document.body.appendChild(widget);
        });
      } else {
        alert('請使用最新版 Chrome 或 Edge 瀏覽器。');
      }
    });

    updateLanguageUI();
  </script>
</body>
</html>
