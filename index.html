<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>機場即時航班懸浮小工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 10px;
    }
    
    .widget-container {
      width: 320px; background: #1e293b; border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); overflow: hidden;
      border: 1px solid #334155; padding: 12px;
    }
    
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #334155;
    }
    .airport-title { font-size: 15px; font-weight: bold; color: #38bdf8; }
    .nav-btn {
      background: #334155; border: none; color: #f8fafc; cursor: pointer;
      padding: 4px 8px; border-radius: 4px; font-size: 12px; transition: 0.2s;
    }
    .nav-btn:hover { background: #475569; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; color: #94a3b8; font-weight: 500; padding-bottom: 6px; }
    td { padding: 6px 0; border-top: 1px dashed #334155; }
    
    .flight-no { font-weight: bold; color: #f1f5f9; }
    .status-ok { color: #4ade80; }
    .status-delay { color: #f87171; }
    
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; font-size: 10px; color: #64748b;
    }
    .btn-pip {
      background: #0284c7; color: white; border: none; padding: 8px 16px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .btn-pip:hover { background: #0369a1; }
    .refresh-btn { background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>

  <button id="openPipBtn" class="btn-pip" style="margin-bottom: 15px;">📌 開啟桌面置頂懸浮窗</button>

  <div id="widget" class="widget-container">
    <div class="header">
      <button class="nav-btn" onclick="prevAirport()">◄</button>
      <div class="airport-title" id="airportName">✈ 赫爾辛基 (HEL)</div>
      <button class="nav-btn" onclick="nextAirport()">►</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>預定</th>
          <th>航班</th>
          <th>目的地</th>
          <th>狀態</th>
        </tr>
      </thead>
      <tbody id="flightTableBody">
        <tr><td colspan="4" style="text-align:center; color:#94a3b8;">資料載入中...</td></tr>
      </tbody>
    </table>

    <div class="footer">
      <div>
        <span id="updateTime">更新: --:--</span>
        <button class="refresh-btn" onclick="fetchFlightData()">🔄</button>
      </div>
      <label><input type="checkbox" id="autoRotate" checked> 自動輪播 (15s)</label>
    </div>
  </div>

  <script>
    // 機場設定
    const airports = [
      { code: 'HEL', name: '赫爾辛基 (HEL)', icao: 'EFHK' },
      { code: 'HND', name: '東京羽田 (HND)', icao: 'RJTT' },
      { code: 'TPE', name: '台北桃園 (TPE)', icao: 'RCTP' }
    ];

    // API Key 設定 (替換為您申請的 RapidAPI Key)
    const API_KEY = 'YOUR_AERODATABOX_API_KEY'; 

    let currentIndex = 0;
    let flightCache = {};

    async function fetchFlightData() {
      const ap = airports[currentIndex];
      const tbody = document.getElementById('flightTableBody');
      document.getElementById('airportName').innerText = `✈ ${ap.name}`;

      // 如果有真實 API Key 且非預設字串，則從網路抓取即時動態
      if (API_KEY && API_KEY !== 'YOUR_AERODATABOX_API_KEY') {
        try {
          const response = await fetch(`https://aerodatabox.p.rapidapi.com/flights/airports/icao/${ap.icao}?departures=true&limit=5`, {
            headers: {
              'x-rapidapi-key': API_KEY,
              'x-rapidapi-host': 'aerodatabox.p.rapidapi.com'
            }
          });
          const data = await response.json();
          renderFlights(parseApiData(data.departures));
          updateTimestamp();
          return;
        } catch (e) {
          console.error("API 讀取失敗，改用備用資料展示", e);
        }
      }

      // 未設定 API Key 時的展示資料
      renderMockData(ap.code);
      updateTimestamp();
    }

    function parseApiData(departures) {
      if (!departures) return [];
      return departures.slice(0, 5).map(f => {
        const time = (f.movement.scheduledTimeLocal || '').substring(11, 16);
        const code = f.number || '--';
        const dest = (f.movement.airport && (f.movement.airport.iata || f.movement.airport.name)) || '未定';
        const status = f.status || '排定';
        const isOk = !status.includes('Canceled') && !status.includes('Delayed');
        return { time, code, dest, status, ok: isOk };
      });
    }

    function renderFlights(flights) {
      const tbody = document.getElementById('flightTableBody');
      if (flights.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">無即時航班資訊</td></tr>';
        return;
      }
      tbody.innerHTML = flights.map(f => `
        <tr>
          <td>${f.time}</td>
          <td class="flight-no">${f.code}</td>
          <td>${f.dest}</td>
          <td class="${f.ok ? 'status-ok' : 'status-delay'}">${f.status}</td>
        </tr>
      `).join('');
    }

    function renderMockData(code) {
      const mock = {
        HEL: [
          { time: '14:05', code: 'AY133', dest: 'HND 東京', status: '準時', ok: true },
          { time: '14:20', code: 'AY141', dest: 'BKK 曼谷', status: '準時', ok: true },
          { time: '14:35', code: 'AY121', dest: 'DEL 德里', status: '準時', ok: true },
          { time: '14:50', code: 'KL117', dest: 'AMS 阿姆斯特丹', status: '延誤 15m', ok: false },
          { time: '15:10', code: 'LH246', dest: 'FRA 法蘭克福', status: '登機中', ok: true }
        ],
        HND: [
          { time: '14:15', code: 'JL097', dest: 'TSA 松山', status: '準時', ok: true },
          { time: '14:30', code: 'NH853', dest: 'TSA 松山', status: '準時', ok: true },
          { time: '14:45', code: 'CI101', dest: 'TPE 桃園', status: '登機中', ok: true },
          { time: '15:00', code: 'JL031', dest: 'BKK 曼谷', status: '準時', ok: true },
          { time: '15:20', code: 'CX549', dest: 'HKG 香港', status: '延誤 10m', ok: false }
        ],
        TPE: [
          { time: '14:10', code: 'BR198', dest: 'NRT 成田', status: '準時', ok: true },
          { time: '14:25', code: 'CI108', dest: 'NRT 成田', status: '登機中', ok: true },
          { time: '14:40', code: 'JX802', dest: 'NRT 成田', status: '準時', ok: true },
          { time: '15:05', code: 'BR215', dest: 'SIN 新加坡', status: '準時', ok: true },
          { time: '15:30', code: 'CI751', dest: 'SIN 新加坡', status: '準時', ok: true }
        ]
      };
      renderFlights(mock[code] || []);
    }

    function updateTimestamp() {
      const now = new Date();
      document.getElementById('updateTime').innerText = `更新: ${now.toTimeString().substring(0, 5)}`;
    }

    function nextAirport() {
      currentIndex = (currentIndex + 1) % airports.length;
      fetchFlightData();
    }

    function prevAirport() {
      currentIndex = (currentIndex - 1 + airports.length) % airports.length;
      fetchFlightData();
    }

    // 每 15 秒輪播下一個機場
    setInterval(() => {
      if (document.getElementById('autoRotate').checked) {
        nextAirport();
      }
    }, 15000);

    // Document Picture-in-Picture 功能觸發
    document.getElementById('openPipBtn').addEventListener('click', async () => {
      if ('documentPictureInPicture' in window) {
        const pipWindow = await window.documentPictureInPicture.requestWindow({
          width: 340,
          height: 210,
        });

        [...document.styleSheets].forEach((styleSheet) => {
          try {
            const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
            const style = document.createElement('style');
            style.textContent = cssRules;
            pipWindow.document.head.appendChild(style);
          } catch (e) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = styleSheet.href;
            pipWindow.document.head.appendChild(link);
          }
        });

        const widget = document.getElementById('widget');
        pipWindow.document.body.appendChild(widget);

        pipWindow.addEventListener('unload', () => {
          document.body.appendChild(widget);
        });
      } else {
        alert('您的瀏覽器不支援置頂懸浮窗，請使用 Chrome 或 Edge！');
      }
    });

    fetchFlightData();
  </script>
</body>
</html>
