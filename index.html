<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airport Departure Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 10px;
    }
    .widget-container {
      width: 340px; background: #1e293b; border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); border: 1px solid #334155; padding: 12px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; }
    .lang-select { background: #334155; color: #f8fafc; border: 1px solid #475569; border-radius: 4px; padding: 2px 4px; font-size: 10px; outline: none; cursor: pointer; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #334155; }
    .airport-title { font-size: 15px; font-weight: bold; color: #38bdf8; }
    .nav-btn { background: #334155; border: none; color: #f8fafc; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 14px; }
    .nav-btn:hover { background: #475569; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    th { text-align: left; color: #94a3b8; font-weight: 500; padding-bottom: 6px; }
    td { padding: 7px 0; border-top: 1px dashed #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .col-time { width: 55px; }
    .col-flight { width: 75px; font-weight: bold; color: #38bdf8; }
    .col-dest { width: auto; color: #f1f5f9; }
    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 10px; color: #64748b; }
    .btn-pip { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-bottom: 15px; }
    .refresh-btn { background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

  <button id="openPipBtn" class="btn-pip">📌 開啟桌面置頂懸浮窗</button>

  <div id="widget" class="widget-container">
    <div class="top-bar">
      <span style="color: #64748b;">✈ Live Departures</span>
      <select id="langSelect" class="lang-select">
        <option value="ja">日本語</option>
        <option value="zh">繁體中文</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="header">
      <button class="nav-btn" id="prevBtn">◄</button>
      <div class="airport-title" id="airportName">--</div>
      <button class="nav-btn" id="nextBtn">►</button>
    </div>

    <table>
      <thead>
        <tr id="tableHeader">
          <th class="col-time">定刻</th>
          <th class="col-flight">便名</th>
          <th class="col-dest">行先</th>
        </tr>
      </thead>
      <tbody id="flightTableBody">
        <tr><td colspan="3" style="text-align:center; color:#94a3b8;">Loading...</td></tr>
      </tbody>
    </table>

    <div class="footer">
      <div>
        <span id="updateTime">更新: --:--</span>
        <button class="refresh-btn" id="manualRefreshBtn">🔄</button>
      </div>
      <span style="color: #475569;">台日專用免 Key 版</span>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 多國語言字典（解決 API 只回傳英文地名與標題的問題）
    // -------------------------------------------------------------
    const AIRPORT_NAMES = {
      HND: { ja: '東京羽田 (HND)', zh: '東京羽田 (HND)', en: 'Tokyo Haneda (HND)' },
      TPE: { ja: '台北桃園 (TPE)', zh: '台北桃園 (TPE)', en: 'Taipei Taoyuan (TPE)' },
      TSA: { ja: '台北松山 (TSA)', zh: '台北松山 (TSA)', en: 'Taipei Songshan (TSA)' }
    };

    const CITY_DICT = {
      ja: { 'HND': '羽田', 'NRT': '成田', 'KIX': '関西', 'TPE': '台北桃園', 'TSA': '台北松山', 'KHH': '高雄', 'CTS': '札幌', 'FUK': '福岡', 'NGO': '中部', 'OKA': '沖縄', 'HKG': '香港', 'ICN': '仁川', 'BKK': 'バンコク', 'SIN': 'シンガポール', 'LHR': 'ロンドン', 'CDG': 'パリ' },
      zh: { 'HND': '東京羽田', 'NRT': '東京成田', 'KIX': '大阪關西', 'TPE': '台北桃園', 'TSA': '台北松山', 'KHH': '高雄小港', 'CTS': '札幌新千歲', 'FUK': '福岡', 'NGO': '名古屋中部', 'OKA': '沖繩那霸', 'HKG': '香港', 'ICN': '首爾仁川', 'BKK': '曼谷', 'SIN': '新加坡', 'LHR': '倫敦', 'CDG': '巴黎' },
      en: { 'HND': 'Tokyo Haneda', 'NRT': 'Tokyo Narita', 'KIX': 'Osaka Kansai', 'TPE': 'Taipei Taoyuan', 'TSA': 'Taipei Songshan', 'KHH': 'Kaohsiung', 'CTS': 'Sapporo', 'FUK': 'Fukuoka', 'NGO': 'Nagoya', 'OKA': 'Okinawa', 'HKG': 'Hong Kong', 'ICN': 'Seoul Incheon' }
    };

    const i18n = {
      ja: { pipBtn: '📌 最前面に表示 (PiP)', headers: ['定刻', '便名', '行先'], update: '更新' },
      zh: { pipBtn: '📌 開啟桌面置頂懸浮窗', headers: ['時間', '航班', '目的地'], update: '更新' },
      en: { pipBtn: '📌 Pin to Desktop', headers: ['Time', 'Flight', 'Destination'], update: 'Updated' }
    };

    const selectedAirports = [
      { code: 'HND', icao: 'RJTT', region: 'JP', timeZone: 'Asia/Tokyo' },
      { code: 'TPE', icao: 'RCTP', region: 'TW', timeZone: 'Asia/Taipei' },
      { code: 'TSA', icao: 'RCSS', region: 'TW', timeZone: 'Asia/Taipei' }
    ];

    let currentIndex = 0;
    let currentLang = 'ja';

    // 計算指定時區當前時間 (HH:mm)
    function getAirportLocalTimeStr(timeZone) {
      const now = new Date();
      const options = { timeZone, hour12: false, hour: '2-digit', minute: '2-digit' };
      const parts = new Intl.DateTimeFormat('en-GB', options).formatToParts(now);
      const v = {};
      parts.forEach(p => v[p.type] = p.value);
      return `${v.hour}:${v.minute}`;
    }

    // 主資料抓取門戶：分流台灣與日本 API
    async function fetchFlightData() {
      const ap = selectedAirports[currentIndex];
      renderLoading();

      try {
        let flights = [];
        if (ap.region === 'TW') {
          flights = await fetchTaiwanTDX(ap.code);
        } else {
          flights = await fetchJapanFlightradar(ap.code);
        }

        filterAndRender(flights, ap);
        updateTimestamp();
      } catch (e) {
        console.error("Fetch Error:", e);
        renderFlights([], '資料讀取失敗');
      }
    }

    // 1. 台灣機場 API：使用台灣政府 TDX 免費開放資料 API
    async function fetchTaiwanTDX(airportCode) {
      const url = `https://tdx.transportdata.tw/api/basic/v2/Air/FIDS/Airport/Departure/${airportCode}?$top=30&$format=JSON`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('TDX API Error');
      const data = await res.json();

      return data.map(f => {
        // 時間處理
        const schTime = f.ScheduleDepartureTime || f.TargetDepartureTime || '';
        const timeStr = schTime ? schTime.substring(11, 16) : '--:--';
        
        // 班號處理
        const code = `${f.AirlineID || ''}${f.FlightNumber || ''}`;
        
        // 共掛判斷
        const isCodeshare = !!f.MasterFlightNumber && f.MasterFlightNumber !== f.FlightNumber;
        
        // 目的地 IATA 代碼
        const destCode = f.ArrivalAirportID || '';
        const destNameRaw = f.ArrivalAirportName ? (f.ArrivalAirportName.Zh_tw || f.ArrivalAirportName.En || '') : destCode;

        return {
          time: timeStr,
          code: code,
          destCode: destCode,
          destNameRaw: destNameRaw,
          isCodeshare: isCodeshare
        };
      });
    }

    // 2. 日本機場 API：使用公共開放 API endpoint
    async function fetchJapanFlightradar(airportIATA) {
      const url = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.flightradar24.com/common/v1/airport.json?code=${airportIATA}&plugin[]=&plugin-setting[schedule][mode]=departures&plugin-setting[schedule][timestamp]=${Math.floor(Date.now()/1000)}&page=1&limit=25`)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Japan API Error');
      const json = await res.json();
      
      const list = json.result.response.airport.pluginData.schedule.departures.data || [];

      return list.map(item => {
        const f = item.flight;
        const schTime = f.time.scheduled.departure;
        let timeStr = '--:--';
        if (schTime) {
          const d = new Date(schTime * 1000);
          // 轉為日本 JST 時間 (HH:mm)
          timeStr = d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit' });
        }

        const code = f.identification.number.default || '--';
        const isCodeshare = !!(f.codeshare && f.codeshare.length > 0);
        const destCode = f.airport.destination ? f.airport.destination.code.iata : '';
        const destNameRaw = f.airport.destination ? f.airport.destination.name : '';

        return {
          time: timeStr,
          code: code,
          destCode: destCode,
          destNameRaw: destNameRaw,
          isCodeshare: isCodeshare
        };
      });
    }

    // 依「當地現在時間」過濾 + 去除共掛班號
    function filterAndRender(fullList, ap) {
      const curLocalTime = getAirportLocalTimeStr(ap.timeZone);

      // 1. 去除共掛班號
      let clean = fullList.filter(f => !f.isCodeshare);

      // 2. 篩選晚於「機場當地現在時間」的班次
      let upcoming = clean.filter(f => f.time >= curLocalTime);

      // 班次過少時補齊
      if (upcoming.length < 5) {
        upcoming = upcoming.concat(clean);
      }

      // 3. 去重並取前 5 筆
      const displayFlights = [];
      const seen = new Set();
      for (const f of upcoming) {
        const key = `${f.time}_${f.destCode}`;
        if (!seen.has(key)) {
          seen.add(key);
          displayFlights.push(f);
        }
        if (displayFlights.length >= 5) break;
      }

      renderFlights(displayFlights);
    }

    // 轉換目的地顯示名稱（優先匹配字典檔）
    function getTranslatedDest(destCode, destNameRaw) {
      const dict = CITY_DICT[currentLang] || {};
      if (dict[destCode]) {
        return `${destCode} ${dict[destCode]}`;
      }
      return destCode ? `${destCode} ${destNameRaw}` : destNameRaw;
    }

    function renderWidget() {
      const ap = selectedAirports[currentIndex];
      const nameObj = AIRPORT_NAMES[ap.code];
      const displayName = nameObj ? (nameObj[currentLang] || nameObj.en) : ap.code;
      
      document.getElementById('airportName').innerText = `✈ ${displayName}`;
      fetchFlightData();
    }

    function renderLoading() {
      document.getElementById('flightTableBody').innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8;">Loading...</td></tr>`;
    }

    function renderFlights(flights, msg = 'No Departures') {
      const tbody = document.getElementById('flightTableBody');
      if (!flights || flights.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8;">${msg}</td></tr>`;
        return;
      }

      tbody.innerHTML = flights.map(f => {
        const destDisplay = getTranslatedDest(f.destCode, f.destNameRaw);
        return `
          <tr>
            <td class="col-time">${f.time}</td>
            <td class="col-flight">${f.code}</td>
            <td class="col-dest" title="${destDisplay}">${destDisplay}</td>
          </tr>
        `;
      }).join('');
    }

    function updateTimestamp() {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const t = i18n[currentLang] || i18n.ja;
      document.getElementById('updateTime').innerText = `${t.update}: ${timeStr}`;
    }

    function updateLanguageUI() {
      const t = i18n[currentLang] || i18n.ja;
      document.getElementById('openPipBtn').innerText = t.pipBtn;
      const ths = document.querySelectorAll('#tableHeader th');
      t.headers.forEach((h, idx) => { if(ths[idx]) ths[idx].innerText = h; });
      renderWidget();
    }

    function attachEventListeners(targetDoc) {
      targetDoc.addEventListener('click', (e) => {
        if (e.target.id === 'nextBtn') {
          currentIndex = (currentIndex + 1) % selectedAirports.length;
          renderWidget();
        } else if (e.target.id === 'prevBtn') {
          currentIndex = (currentIndex - 1 + selectedAirports.length) % selectedAirports.length;
          renderWidget();
        } else if (e.target.id === 'manualRefreshBtn') {
          fetchFlightData();
        }
      });

      targetDoc.addEventListener('change', (e) => {
        if (e.target.id === 'langSelect') {
          currentLang = e.target.value;
          updateLanguageUI();
        }
      });
    }

    attachEventListeners(document);

    // Desktop PiP (Picture-in-Picture) 置頂功能
    document.getElementById('openPipBtn').addEventListener('click', async () => {
      if ('documentPictureInPicture' in window) {
        const pipWindow = await window.documentPictureInPicture.requestWindow({ width: 350, height: 220 });
        [...document.styleSheets].forEach((styleSheet) => {
          try {
            const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
            const style = document.createElement('style');
            style.textContent = cssRules;
            pipWindow.document.head.appendChild(style);
          } catch (e) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = styleSheet.href;
            pipWindow.document.head.appendChild(link);
          }
        });

        const widget = document.getElementById('widget');
        pipWindow.document.body.appendChild(widget);
        attachEventListeners(pipWindow.document);

        pipWindow.addEventListener('unload', () => {
          document.body.appendChild(widget);
        });
      } else {
        alert('請使用 Chrome 或 Edge 瀏覽器開啟。');
      }
    });

    updateLanguageUI();
  </script>
</body>
</html>
